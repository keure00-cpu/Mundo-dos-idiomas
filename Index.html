<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mundo dos Idiomas 🌎</title>

<style>
:root{
    --bg:#07111f;
    --bg2:#0d1b2a;
    --card:#101f31;
    --card2:#14263b;
    --text:#f5f7fb;
    --muted:#9caec2;
    --primary:#7c5cff;
    --primary2:#a78bfa;
    --green:#22c55e;
    --yellow:#f59e0b;
    --border:rgba(255,255,255,.09);
    --shadow:0 15px 50px rgba(0,0,0,.25);
}

body.light{
    --bg:#f3f6fb;
    --bg2:#e8edf5;
    --card:#ffffff;
    --card2:#f5f7fb;
    --text:#101827;
    --muted:#64748b;
    --border:rgba(0,0,0,.08);
    --shadow:0 15px 40px rgba(0,0,0,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.3s;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(7,17,31,.9);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

body.light header{
    background:rgba(255,255,255,.9);
}

.nav{
    max-width:1250px;
    margin:auto;
    height:72px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:bold;
}

.logo span{
    font-size:28px;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:var(--muted);
    text-decoration:none;
    transition:.2s;
}

nav a:hover{
    color:var(--text);
}

.nav-actions{
    display:flex;
    gap:10px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
}

/* BUTTONS */

.btn{
    border:none;
    padding:13px 20px;
    border-radius:12px;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:white;
}

.btn-secondary{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
}

/* HERO */

.hero{
    min-height:620px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:var(--primary);
    filter:blur(180px);
    opacity:.15;
    top:-150px;
    right:-150px;
}

.hero-content{
    max-width:1250px;
    width:100%;
    margin:auto;
    padding:80px 20px;
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:60px;
    align-items:center;
}

.badge{
    display:inline-block;
    padding:9px 14px;
    background:rgba(124,92,255,.15);
    border:1px solid rgba(124,92,255,.3);
    border-radius:30px;
    color:#b9a9ff;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(42px,7vw,78px);
    line-height:1;
    margin-bottom:25px;
}

.gradient{
    background:linear-gradient(90deg,#8b5cf6,#60a5fa,#22c55e);
    -webkit-background-clip:text;
    color:transparent;
}

.hero p{
    color:var(--muted);
    font-size:19px;
    line-height:1.7;
    max-width:650px;
}

.hero-buttons{
    display:flex;
    gap:12px;
    margin-top:30px;
    flex-wrap:wrap;
}

.stats{
    display:flex;
    gap:35px;
    margin-top:45px;
    flex-wrap:wrap;
}

.stat strong{
    display:block;
    font-size:26px;
}

.stat span{
    color:var(--muted);
    font-size:14px;
}

.globe-card{
    min-height:400px;
    border-radius:30px;
    background:linear-gradient(145deg,var(--card),var(--card2));
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}

.globe{
    font-size:160px;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    50%{
        transform:translateY(-15px) rotate(5deg);
    }
}

.floating-language{
    position:absolute;
    padding:12px 15px;
    border-radius:14px;
    background:var(--card);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
}

.f1{top:40px;left:30px;}
.f2{top:100px;right:20px;}
.f3{bottom:60px;left:30px;}
.f4{bottom:30px;right:30px;}

/* SECTIONS */

.section{
    max-width:1250px;
    margin:auto;
    padding:90px 20px;
}

.section-title{
    font-size:38px;
    margin-bottom:10px;
}

.section-subtitle{
    color:var(--muted);
    margin-bottom:35px;
}

/* SEARCH */

.search-box{
    width:100%;
    padding:18px 20px;
    border-radius:15px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    outline:none;
    margin-bottom:30px;
}

/* LANGUAGES */

.languages-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.language-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
    transition:.25s;
    cursor:pointer;
}

.language-card:hover{
    transform:translateY(-7px);
    border-color:var(--primary);
}

.language-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.flag{
    font-size:42px;
}

.language-card h3{
    margin-top:18px;
    font-size:19px;
}

.language-card p{
    color:var(--muted);
    font-size:14px;
    margin-top:7px;
}

.progress-bar{
    height:8px;
    background:rgba(255,255,255,.08);
    border-radius:20px;
    margin-top:18px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--primary),var(--green));
    width:0%;
}

/* DASHBOARD */

.dashboard{
    display:none;
    max-width:1250px;
    margin:auto;
    padding:40px 20px;
}

.dashboard.active{
    display:block;
}

.dashboard-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:20px;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:25px;
}

.sidebar{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    height:max-content;
}

.profile{
    text-align:center;
    padding-bottom:20px;
    border-bottom:1px solid var(--border);
}

.avatar{
    width:75px;
    height:75px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--primary),#3b82f6);
    border-radius:50%;
    font-size:30px;
}

.profile
