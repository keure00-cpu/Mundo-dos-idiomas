<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mundo dos Idiomas V2</title>

<style>
:root{
  --bg:#07111f;
  --card:#101f31;
  --card2:#162a42;
  --primary:#7c5cff;
  --text:#ffffff;
  --muted:#aab6c7;
  --border:rgba(255,255,255,.10);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,17,31,.95);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

nav{
  max-width:1200px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
}

.primary{
  background:linear-gradient(135deg,#7c5cff,#a78bfa);
  color:white;
}
